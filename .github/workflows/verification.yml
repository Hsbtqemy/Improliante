# Vérification distante — constat OPS-01 de l'audit du 11 septembre 2026.
#
# Ce que ce fichier EST : la suite rejouée sur le MOTEUR DE PRODUCTION, à chaque
# commit, sur une machine qui n'est pas celle du développeur.
#
# Ce qu'il n'est PAS encore : la barrière. Le déploiement est déclenché par le
# push lui-même (webhook GitHub → deploiement/deploy.sh), donc cette vérification
# démarre en parallèle de la mise en ligne — elle constate, elle ne retient rien.
# Fermer la barrière demande que le récepteur écoute la CONCLUSION de ce workflow
# au lieu du push : c'est une case de DEP-1, elle exige la machine.
#
# Ce qu'il apporte dès maintenant : les quatre tests de concurrence, « skipped »
# sous SQLite, tournent enfin — et le hook de pré-push, qui se contourne d'un
# `--no-verify` et s'oublie à chaque clone, cesse d'être le seul endroit où ils
# tournent.

name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verification-${{ github.ref }}
  # On annule les runs dépassés d'une PR, jamais ceux de `main` : une fois la
  # barrière fermée (DEP-1), un run annulé vaudrait « pas vérifié », et deux
  # pushes rapprochés laisseraient un commit passer sans que rien ne le dise.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: Suite sur PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        # À ALIGNER sur la version du VPS quand elle sera connue (case de DEP-1).
        # Éprouver la numérotation légale sur une version qui n'est pas celle de
        # production prouve moins que ce qu'on croit.
        image: postgres:16
        env:
          POSTGRES_USER: asso
          POSTGRES_PASSWORD: asso
          POSTGRES_DB: asso_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Le rôle doit pouvoir CRÉER une base : Django en fabrique une préfixée
      # « test_ ». `POSTGRES_USER` est superutilisateur sur cette image.
      DB_NAME: asso_test
      DB_USER: asso
      DB_PASSWORD: asso
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Le plancher annoncé par le README, pas la version du poste de
          # développement (3.14) : c'est le plancher qui doit tenir.
          python-version: '3.12'
          cache: pip
          # Les DEUX fichiers : `requirements-dev.txt` se contente d'un `-r` vers
          # l'autre, si bien qu'une version modifiée dans `requirements.txt`
          # laisserait le cache intact — et la CI installerait l'ancienne.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Bibliothèques natives de WeasyPrint
        # La MÊME liste que le VPS devra installer (case de DEP-1). La tenir ici
        # la rend exécutable : si elle est incomplète, l'étape « Moteur PDF »
        # ci-dessous le dit, sur une machine Debian, avant la mise en ligne.
        #
        # WeasyPrint 69 ouvre exactement SIX bibliothèques (`weasyprint/text/ffi.py`) :
        #   libgobject-2.0.so.0 · libpango-1.0.so.0 · libpangoft2-1.0.so.0
        #   libharfbuzz.so.0 · libharfbuzz-subset.so.0 · libfontconfig.so.1
        # Ni cairo ni gdk-pixbuf depuis la v60 (Pillow a remplacé le second) : la
        # liste qui circulait dans le dépôt en nommait deux inutiles et oubliait
        # glib, harfbuzz et fontconfig. On installe les paquets dont les NOMS sont
        # stables d'une version de Debian à l'autre ; glib et harfbuzz arrivent en
        # dépendance dure de pango, `harfbuzz-subset` non — d'où sa présence ici.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libfontconfig1

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Moteur PDF
        # Ce que la suite ne prouve PAS : elle remplace `html_vers_pdf` partout
        # où un PDF est attendu, et passe donc sur un poste Windows sans GTK.
        # Personne n'a jamais vu WeasyPrint charger ses bibliothèques natives
        # ailleurs que dans une intention. Ici, il rend pour de bon.
        #
        # Ce que ça ne prouve pas non plus : qu'une facture soit correcte. Juste
        # que le moteur se charge et produit un PDF.
        env:
          DJANGO_DEBUG: '1'
        run: |
          python - <<'FIN'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          django.setup()
          from apps.common.pdf import html_vers_pdf
          pdf = html_vers_pdf("<h1>Vérification</h1>")
          assert pdf.startswith(b"%PDF"), pdf[:40]
          print(f"WeasyPrint rend : {len(pdf)} octets")
          FIN

      - name: Lint et format
        run: |
          ruff check .
          ruff format --check .

      - name: Suite sur le moteur de production
        run: |
          set -o pipefail
          TEST_POSTGRES=1 python -m pytest -q | tee resultat.txt

      - name: Aucun test ignoré
        # Le garde-fou que le hook de pré-push avait identifié, et la seule chose
        # qui distingue cette vérification d'un run ordinaire : un « skipped » ici
        # signifie que la bascule PostgreSQL n'a PAS pris. Le run se croirait
        # complet en ayant laissé passer précisément ce qu'il vient chercher —
        # `select_for_update`, dont dépend la numérotation légale des factures.
        run: |
          if grep -q 'skipped' resultat.txt; then
            echo "::error::Des tests se sont ignorés sur PostgreSQL : la bascule n'a pas pris."
            grep -o '[0-9]* skipped' resultat.txt
            exit 1
          fi

      - name: Migrations à jour
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py makemigrations --check --dry-run

      - name: Contrôles de déploiement
        # En conditions de production : DEBUG à 0, clé secrète fournie, hôtes
        # déclarés. `--fail-level WARNING` fait échouer sur un avertissement, que
        # `check --deploy` rend sans cela avec un code de retour nul.
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'cle-de-verification-jetable-sans-valeur-en-production-0123456789' }}
          DJANGO_ALLOWED_HOSTS: improliante.example
          DJANGO_CSRF_TRUSTED_ORIGINS: https://improliante.example
        run: python manage.py check --deploy --fail-level WARNING
